name: Sephoria Ticket Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}      # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor_sephoria_once.py

      - name: Commit updated state
        run: |
          git config user.name "ticket-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor_state.json
          git diff --staged --quiet || git commit -m "Update monitor state"
          git push
